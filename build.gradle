plugins {
        id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
        id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
        archivesName = project.archives_base_name
}

repositories {
        maven {url = "https://api.modrinth.com/maven"}
        maven { url 'https://maven.ladysnake.org/releases' }
        maven { url "https://cursemaven.com" }
        maven { url 'https://maven.wispforest.io/releases/' }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
}


loom {
        splitEnvironmentSourceSets()

        mods {
                "shit-to-fit" {
                        sourceSet sourceSets.main
                        sourceSet sourceSets.client
                }
        }
}

dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        modImplementation include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cca_version}")
        modImplementation "curse.maven:craft-time-438726:5778493"
        include "curse.maven:craft-time-438726:5778493"
        modImplementation "maven.modrinth:tieredz:1.3.3+1.20.1"

        modImplementation "io.wispforest:owo-lib:${owo_version}"
        include "io.wispforest:owo-lib:${owo_version}"

        modApi "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
        modApi "com.terraformersmc:modmenu:${mod_menu_version}"
}

processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
                expand "version": project.version
        }
}

tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
}

java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
}

jar {
        from("LICENSE") {
                rename { "${it}_${project.base.archivesName.get()}" }
        }
}
